services:
  postgres:
    image: postgres:16-alpine
    container_name: church_register_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-church}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-church}
      POSTGRES_DB: ${POSTGRES_DB:-church_register}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-church} -d ${POSTGRES_DB:-church_register}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    container_name: church_register_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@postgres:5432/${POSTGRES_DB:-church_register}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      BATCH_SIZE: ${BATCH_SIZE:-200}
    volumes:
      - ./secrets:/secrets:ro

  normalize:
    build: .
    container_name: church_register_normalize
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@postgres:5432/${POSTGRES_DB:-church_register}
    command: ["npm", "run", "normalize"]

  verify:
    build: .
    container_name: church_register_verify
    profiles: ["verify"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@postgres:5432/${POSTGRES_DB:-church_register}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    volumes:
      - ./secrets:/secrets:ro
    command: ["npm", "run", "verify"]

volumes:
  postgres_data:
